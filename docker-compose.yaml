    #         - sqlite3_DATABASE=forgejo
    #     networks:
    #         - forgejo
    #     volumes:
    #         - sqlite3-data:/var/lib/sqlite3

networks:
    dns-services:
        ipam:
            config:
                - subnet: 172.30.0.0/24
    forgejo:
        external: false

secrets:
    pihole_password:
        file: /run/bootstrap/pihole_password
    forgejo_secret_key:
        file: /run/bootstrap/forgejo_secret_key