services:
    pihole:
        container_name: pihole
        image: pihole/pihole:2026.11.0
        ports:
            # DNS Ports
            - "53:53/tcp"
            - "53:53/udp"
            # Default HTTP Port
            - "80:80/tcp"
            # Default HTTPs Port. FTL will generate a self-signed certificate
            - "443:443/tcp"
        environment:
            # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
            TZ: "America/Toronto"
            # Set a password to access the web interface. Not setting one will result in a random password being assigned
            FTLCONF_webserver_api_password: ${WEBSERVER_API_PASSWORD}
            # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
            FTLCONF_dns_listeningMode: "ALL"
            FTLCONF_dns_reply_host_IPv4: "192.168.100.200"
            FTLCONF_dns_reply_host_force4: "true"
            FTLCONF_dns_upstreams: "172.30.0.3#5335"
        volumes:
            # For persisting Pi-hole's databases and common configuration file
            - "../etc-pihole:/etc/pihole"
            # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
            #- './etc-dnsmasq.d:/etc/dnsmasq.d'
        cap_add:
            # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
            # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
            - SYS_TIME
            # Optional, if Pi-hole should get some more processing time
            - SYS_NICE
        restart: unless-stopped
        networks:
            dns-services:
                ipv4_address: 172.30.0.2
        depends_on: [unbound]
    unbound:
        container_name: unbound
        image: klutchell/unbound@sha256:5af26c41f24021dc58a19dd641b09f008a66b90229723117c085293429c684f5
        restart: unless-stopped
        volumes:
            - ./configs/unbound:/etc/unbound/custom.conf.d:ro
        networks:
            dns-services:
                ipv4_address: 172.30.0.3
    forgejo:
        container_name: forgejo
        image: codeberg.org/forgejo/forgejo@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04 #v17.0.2-rootless
        restart: unless-stopped
        environment:
            FORGEJO__DEFAULT__APP_NAME: "forgejo"
            FORGEJO__database__DB_TYPE: "sqlite3"
            FORGEJO__cache__ADAPTER: "twoqueue"
            FORGEJO__cache__HOST: '{"size": 100, "recent_ratio":0.25, "ghost_ratio":0.5}'
        networks:
            - forgejo
        volumes:
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "3000:3000"
            - "222:22"
    #     depends_on:
    #         - sqlite3-db
    # sqlite3-db:
    #     image: keinos/sqlite3@sha256:b577e65892c6468d94b390097eda4488e05253470c161bdea68a05abb961fa17 #v3.54.1
    #     restart: unless-stopped
    #     environment:
    #         - sqlite3_ROOT_PASSWORD=forgejo
    #         - sqlite3_USER=forgejo
    #         - sqlite3_PASSWORD=forgejo
    #         - sqlite3_DATABASE=forgejo
    #     networks:
    #         - forgejo
    #     volumes:
    #         - sqlite3-data:/var/lib/sqlite3

networks:
    dns-services:
        ipam:
            config:
                - subnet: 172.30.0.0/24
    forgejo:
        external: false

